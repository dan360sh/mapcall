<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MapCall</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Login screen ─────────────────────────────────────────────────────── -->
  <div id="screen-login" class="screen">
    <div class="login-card">
      <div class="app-logo">
        <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
          <circle cx="28" cy="28" r="28" fill="url(#g)"/>
          <path d="M28 14C21.4 14 16 19.4 16 26c0 9 12 22 12 22s12-13 12-22c0-6.6-5.4-12-12-12zm0 16.5A4.5 4.5 0 1128 22a4.5 4.5 0 010 8.5z" fill="white"/>
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse">
              <stop stop-color="#4facfe"/>
              <stop offset="1" stop-color="#00f2fe"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="app-title">MapCall</h1>
      <p class="app-sub">Смотри мир глазами других</p>

      <button id="btn-yandex" class="oauth-btn oauth-yandex">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6H9l3-7 3 7h-2v6z"/></svg>
        Войти через Яндекс
      </button>
      <button id="btn-google" class="oauth-btn oauth-google">
        <svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Войти через Google
      </button>

      <div class="divider"><span>или</span></div>

      <div id="guest-form" class="guest-form">
        <input id="guest-name" class="guest-input" type="text" placeholder="Введите имя" maxlength="32" />
        <button id="btn-guest-submit" class="oauth-btn oauth-guest">Войти</button>
      </div>

      <p id="login-error" class="login-error hidden">Ошибка авторизации. Попробуйте снова.</p>
    </div>
  </div>

  <!-- ── Map screen ────────────────────────────────────────────────────────── -->
  <div id="screen-map" class="screen hidden">
    <div id="ymap"></div>

    <!-- User badge (top-right) -->
    <div class="user-badge">
      <img id="user-avatar" class="avatar-sm" src="" alt="" />
      <span id="user-name">...</span>
      <button id="btn-logout" class="btn-logout" title="Выйти">✕</button>
    </div>

    <!-- "Где я" button (bottom-right) -->
    <button id="btn-locate-me" class="locate-btn" title="Где я">⊕</button>

    <!-- Coordinates panel (bottom-left) -->
    <div id="coords-panel" class="coords-panel hidden">
      <span id="coords-text"></span>
      <button id="btn-copy-coords" class="btn-copy-coords" title="Копировать">⎘</button>
    </div>

    <!-- Show-on-map toggle (bottom-center) -->
    <div class="map-bottom">
      <button id="btn-toggle-visible" class="toggle-btn">
        <span class="toggle-icon">👁</span>
        <span id="toggle-label">Показаться на карте</span>
      </button>
    </div>
  </div>

  <!-- ── Incoming call overlay ─────────────────────────────────────────────── -->
  <div id="overlay-incoming" class="overlay hidden">
    <div class="call-card">
      <img id="caller-avatar" class="avatar-lg" src="" alt="" />
      <div id="caller-name" class="call-peer-name"></div>
      <p class="call-hint">Входящий видеозвонок</p>
      <div class="call-btns">
        <button id="btn-accept" class="btn-green">✓ Принять</button>
        <button id="btn-reject" class="btn-red">✕ Отклонить</button>
      </div>
    </div>
  </div>

  <!-- ── Outgoing call overlay ─────────────────────────────────────────────── -->
  <div id="overlay-calling" class="overlay hidden">
    <div class="call-card">
      <div class="spinner"></div>
      <div id="callee-name" class="call-peer-name"></div>
      <p class="call-hint">Вызов...</p>
      <button id="btn-cancel" class="btn-red" style="margin-top:20px">✕ Отменить</button>
    </div>
  </div>

  <!-- ── Active call: CALLER view (video + joystick) ──────────────────────── -->
  <div id="overlay-caller" class="overlay hidden call-fullscreen">
    <video id="remote-video" autoplay playsinline muted="false"></video>

    <div class="joystick-wrap">
      <div class="joystick">
        <!-- row 1 -->
        <div></div>
        <button class="joy" data-dir="up">▲</button>
        <div></div>
        <!-- row 2 -->
        <button class="joy" data-dir="left">◀</button>
        <button class="joy joy-fwd" data-dir="forward" title="Вперёд">⬤</button>
        <button class="joy" data-dir="right">▶</button>
        <!-- row 3 -->
        <div></div>
        <button class="joy" data-dir="down">▼</button>
        <div></div>
      </div>
    </div>

    <button id="btn-hangup-caller" class="btn-hangup">Завершить</button>
  </div>

  <!-- ── Active call: CALLEE view (arrow overlay) ──────────────────────────── -->
  <div id="overlay-callee" class="overlay hidden callee-overlay">
    <div id="arrow-up"      class="arrow arr-up">▲</div>
    <div id="arrow-down"    class="arrow arr-down">▼</div>
    <div id="arrow-left"    class="arrow arr-left">◀</div>
    <div id="arrow-right"   class="arrow arr-right">▶</div>
    <div id="arrow-forward" class="arrow arr-fwd">⬤</div>

    <div class="callee-bar">
      <span class="callee-status">📞 Звонок активен</span>
      <button id="btn-hangup-callee" class="btn-hangup-sm">Завершить</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
