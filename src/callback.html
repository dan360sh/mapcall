<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>MapCall — Авторизация</title>
  <style>
    body { background:#1a1a2e; color:#fff; font-family:sans-serif;
           display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
    p { font-size:1.1rem; opacity:.7; }
  </style>
</head>
<body>
  <p>Выполняется авторизация…</p>
  <script>
    // Токен приходит во fragment (#token=...), чтобы не попадать в логи сервера.
    const params = new URLSearchParams(window.location.hash.slice(1));
    const token = params.get('token');
    const error = params.get('error');
    history.replaceState(null, '', window.location.pathname); // убираем токен из истории

    if (window.opener) {
      // Только своему origin: иначе чужая страница, открывшая этот попап,
      // получила бы токен пользователя.
      const message = token ? { type: 'auth-token', token } : { type: 'auth-error', error };
      window.opener.postMessage(message, window.location.origin);
      window.close();
    } else if (token) {
      localStorage.setItem('mapcall_token', token);
      window.location.replace('./');
    } else {
      document.querySelector('p').textContent = 'Не удалось войти. Закройте окно и попробуйте снова.';
    }
  </script>
</body>
</html>
